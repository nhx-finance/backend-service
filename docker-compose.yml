version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nhx-server-app
    container_name: nhxserver-app
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
#      DB_NAME: ${DB_NAME}
#      DB_USERNAME: ${DB_USERNAME}
#      DB_PASSWORD: ${DB_PASSWORD}
#      MAIL_PORT: ${MAIL_PORT}
#      MAIL_USERNAME: ${MAIL_USERNAME}
#      MAIL_PASSWORD: ${MAIL_PASSWORD}
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: nhxserver-postgres-app
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhxuser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: