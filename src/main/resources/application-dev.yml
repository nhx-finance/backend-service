spring:
  datasource:
    url: jdbc:h2:mem:nhxdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: localhost
    port: 1025
    username: mongsdev@gmail.com
    password:
    protocol: smtp

hedera:
  testnet:
    accountId: ${ACCOUNT_ID}
    privateKey: ${PRIVATE_KEY}
azure:
  storage:
    account-name: nhxstorage
    account-key: ${ACCOUNT_KEY}
    container-name: nhx-dev

nhx:
  app:
    jwtSecret: 5367566859703373367639792F423F452848284D6251655468576D5A71347437
    jwtExpirationMs: 900000  # 15 minutes
    jwtRefreshExpirationMs: 86400000  # 24 hours
    jwtCookieName: nhxJwtToken
    jwtRefreshCookieName: nhxRefreshToken
    base-url: http://localhost:8080
    passwordResetExpirationMs: 1800000  # 30 minutes

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
  ssl:
    enabled: false

logging:
  level:
    org.springframework.security: DEBUG
    com.javaguy.nhxserver: DEBUG
    org.hibernate.SQL: INFO
    com.javaguy.nhxserver.service.security: DEBUG
