spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driverClassName: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
    protocol: smtp

#azure:
#  storage:
#    account-name: ${AZURE_STORAGE_ACCOUNT_NAME}
#    account-key: ${AZURE_STORAGE_ACCOUNT_KEY}
#    container-name: ${AZURE_CONTAINER_NAME}

hedera:
  network: testnet
  operator-id: ${HEDERA_OPERATOR_ID}
  operator-key: ${HEDERA_OPERATOR_KEY}
  token-ids:
    - ${HEDERA_TOKEN_ID_1}
    - ${HEDERA_TOKEN_ID_2}
  mirror-node-url: https://testnet.mirrornode.hedera.com
  transaction-timeout-seconds: 30

nhx:
  app:
    jwtSecret: ${JWT_SECRET}
    jwtExpirationMs: 900000
    jwtRefreshExpirationMs: 86400000
    jwtCookieName: nhxJwtToken
    jwtRefreshCookieName: nhxRefreshToken
    base-url: ${APP_BASE_URL}
    passwordResetExpirationMs: 1800000

exchange:
  rate-source: ${EXCHANGE_RATE_SOURCE:fixed}
  default-rate: ${EXCHANGE_DEFAULT_RATE:1000}
  fee-percentage: ${EXCHANGE_FEE_PERCENTAGE:2.0}

server:
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
  ssl:
    enabled: false

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    com.javaguy.nhxserver: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"

admin:
  email: ${ADMIN_EMAIL:admin@example.com}