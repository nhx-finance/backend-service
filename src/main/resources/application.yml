spring:
  profiles:
    active: prod

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Exchange configuration for USDC/nhSAF trading
exchange:
  rate-source: fixed # or api for dynamic rates
  default-rate: 10.00 # 1 nhSAF = 10 USDC
  fee-percentage: 0.5 # 0.5% transaction fee

logging:
  level:
    org.springframework.security: DEBUG
    com.javaguy.nhxserver: DEBUG
    org.hibernate.SQL: INFO
    com.javaguy.nhxserver.service.security: DEBUG
    com.javaguy.nhxserver.service.hedera: DEBUG